name: Enable database RLS

on:
  workflow_dispatch:

jobs:
  rls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:rls
        env:
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
