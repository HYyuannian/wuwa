name: API smoke test

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run smoke:api
        env:
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
