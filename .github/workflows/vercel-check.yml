name: Vercel check

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Optional Vercel base URL
        required: false
        default: ''

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe candidates
        run: |
          candidates="${{ inputs.base_url }}"
          if [ -z "$candidates" ]; then
            candidates="https://wuwa.vercel.app https://wuwa-hyyuannian.vercel.app https://hyyuannian-wuwa.vercel.app https://wuwa-git-main-hyyuannian.vercel.app"
          fi

          for base in $candidates; do
            echo "== $base =="
            ping_code=$(curl -sS -o /tmp/ping -w "%{http_code}" --max-time 20 "$base/api/ping" || true)
            echo "ping=$ping_code $(head -c 120 /tmp/ping 2>/dev/null || true)"

            cors=$(curl -sS -D - -o /dev/null --max-time 20 -H "Origin: https://hyyuannian.github.io" "$base/api/health" | grep -i '^access-control-allow-origin' || true)
            echo "cors=$cors"

            code=$(curl -sS -o /tmp/health -w "%{http_code}" --max-time 20 "$base/api/health" || true)
            echo "health=$code $(head -c 120 /tmp/health 2>/dev/null || true)"

            if [ "$code" = "200" ]; then
              for path in "/api/characters?page=1&pageSize=3" "/api/weapons?page=1&pageSize=3" "/api/echoes" "/api/stats" "/api/meta"; do
                code=$(curl -sS -o /tmp/body -w "%{http_code}" --max-time 60 "$base$path" || true)
                body=$(cat /tmp/body 2>/dev/null || true)
                summary=$(echo "$body" | jq -c '{total: .total, counts: .counts, status: .status}' 2>/dev/null || echo "$body" | head -c 180)
                echo "$path [$code] -> $summary"
              done
              break
            fi
          done

          detail_code=$(curl -sS -o /tmp/detail -w "%{http_code}" --max-time 20 "$base/api/characters/1304" || true)
          echo "detail [$detail_code] $(head -c 300 /tmp/detail 2>/dev/null || true)"

          list=$(curl -sS --max-time 20 "$base/api/characters?page=1&pageSize=100" || true)
          echo "has-1304=$(echo "$list" | jq -r '[.items[].id] | index("1304") != null')"
          echo "sample-ids=$(echo "$list" | jq -c '[.items[0:10][].id]')"
